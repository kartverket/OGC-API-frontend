name: kartverket-ogc-api

services:
  frontend:
    profiles: [with-frontend]
    build:
      context: ..
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://pygeoapi:5000
      - DATASET_URL=http://localhost:3000
    depends_on:
      pygeoapi:
        condition: service_healthy
    networks:
      - pygeoapi-network

  pygeoapi:
    build:
      context: ../pygeoapi
    ports:
      - "5001:5000"
    volumes:
      # Mount source files for live editing during development
      - ../pygeoapi/pygeoapi-config.yml:/pygeoapi/pygeoapi-config.yml
      - ../pygeoapi/processes:/pygeoapi/processes
      - ../pygeoapi/templates:/pygeoapi/custom_templates
      - ../pygeoapi/mapserver/fonts.txt:/pygeoapi/fonts.txt
      - ../pygeoapi/mapserver/styles:/pygeoapi/styles
      - ../pygeoapi/schemas:/pygeoapi/schemas
      - ../pygeoapi/data:/pygeoapi/data
      - ./volumes/logs:/logs
      - ../pygeoapi/resources/definitions/tiles/EPSG3575Quad.json:/pygeoapi/pygeoapi/resources/definitions/tiles/EPSG3575Quad.json:ro
    environment:
      - PYGEOAPI_URL=http://localhost:5001/
      - NORGE_EXAMPLE_RASTER_PATH=/pygeoapi/data/norway_wgs84_cog.tif
      - db_host=postgis
      - db_name=pygeoapi_test
      - db_user=postgres
      - password=qwer1234
    restart: always
    depends_on:
      postgis:
        condition: service_healthy
      martin:
        condition: service_started
    networks:
      - pygeoapi-network

  martin:
    image: ghcr.io/maplibre/martin
    ports:
      - "3001:3000"
    volumes:
      - ../martin/martin.yaml:/martin.yaml
      - ../martin/styles:/styles
    environment:
      - DATABASE_URL=postgres://postgres:qwer1234@postgis:5432/pygeoapi_test
    command: --config /martin.yaml
    depends_on:
      postgis:
        condition: service_healthy
    restart: always
    networks:
      - pygeoapi-network

  postgis:
    build:
      context: ./postgis
    platform: linux/amd64
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - DB_NAME=pygeoapi_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qwer1234
    restart: always
    networks:
      - pygeoapi-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  pygeoapi-network:
    driver: bridge

volumes:
  postgres_data:
