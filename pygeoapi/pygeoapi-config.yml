  norge-raster:
    type: collection
    title:
      nb-NO: Norge raster
      en-US: Norway raster
    description:
      nb-NO: Topografi-batymetri-dekning (EGM2008-høyde)
      en-US: Topography-Bathymetry coverage (EGM2008 height)
    keywords:
      nb-NO:
        - dekning
        - raster
        - topografi
        - batymetri
      en-US:
        - coverage
        - raster
        - topography
        - bathymetry
    extents:
      spatial:
        bbox: [3.0, 56.5, 32.0, 71.5]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    links:
      - type: text/html
        rel: related
        title: NCEI/NOAA
        href: https://www.ncei.noaa.gov/
      - type: image/png
        rel: preview
        title:
          nb-NO: Forhåndsvisning
          en-US: Preview
        href: /assets/collection-images/norge-raster.png
    providers:
      - type: coverage
        name: rasterio
        data: ${NORGE_EXAMPLE_RASTER_PATH}
        format:
          name: GTiff
          mimetype: image/tiff; application=geotiff
      - type: map
        name: MapScript
        data: ${NORGE_EXAMPLE_RASTER_PATH}
        options:
          type: MS_LAYER_RASTER
        format:
          name: png
          mimetype: image/png
        storage_crs: http://www.opengis.net/def/crs/EPSG/0/4326


