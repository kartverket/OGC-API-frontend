[project]
name = "kartverket-pygeoapi-overlay"
version = "0.1.0"
description = "Locked Python dependency overlay for the Kartverket pygeoapi image"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi",
  "fsspec>=2026.6.0",
  "GeoAlchemy2",
  "geopandas",
  "numpy<2",
  "prometheus-flask-exporter",
  "psycopg2-binary",
  "shapely",
  "SQLAlchemy",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# Import order here is intentional: some imports must run after module-level
# side effects (e.g. patching the OpenAPI spec before pygeoapi caches it).
"entrypoint.py" = ["E402"]
